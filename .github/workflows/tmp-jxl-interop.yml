name: Temporary JPEG XL independent interoperability
on:
  push:
    branches: [arena/f85b76e7-odm-conda]
    paths: [.github/workflows/tmp-jxl-interop.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build independent decoder from pinned source
        run: |
          git init /tmp/jxl-oxide-build
          git -C /tmp/jxl-oxide-build fetch --depth=1 https://github.com/tirr-c/jxl-oxide.git f8ae722ef2d6b782941c89517d19cfbf605c4a9d
          git -C /tmp/jxl-oxide-build checkout --detach FETCH_HEAD
          test "$(git -C /tmp/jxl-oxide-build rev-parse HEAD)" = f8ae722ef2d6b782941c89517d19cfbf605c4a9d
          cargo build --locked --release --no-default-features -p jxl-oxide-cli --manifest-path /tmp/jxl-oxide-build/Cargo.toml
      - name: Build and test research package with independent decoder
        run: pixi run python scripts/tmp_jxl_interop.py

# Exercise decoder in the package test prefix.
