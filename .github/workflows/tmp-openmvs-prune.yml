name: Temporary local-only OpenMVS reduced-tree experiment
on:
  push:
    branches: [arena/af0b980e-odm-conda]
    paths: [.github/workflows/tmp-openmvs-prune.yml]
permissions:
  contents: read
jobs:
  reduced-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Experimentally remove restricted paths from verified staged tree
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_open_research.py')
          text = path.read_text()
          old = '        verify_openmvs_tree(source, research=True)\n'
          new = '''        verify_openmvs_tree(source, research=True)
                  # Temporary experiment: after exact graph verification and before
                  # CMake, remove only named paths from this disposable work tree.
                  from openmvs_graph_policy import fingerprint_tree
                  removed = 0
                  for rel in ('libs/Math/IBFS', 'libs/Math/TRWS'):
                      target = source / rel
                      if target.is_symlink() or not target.is_dir():
                          raise ScaffoldError('Missing or unsafe pruning target: ' + rel)
                      removed += sum(1 for p in target.rglob('*') if p.is_file())
                      shutil.rmtree(target)
                  if removed != 20:
                      raise ScaffoldError('Unexpected restricted file count')
                  for rel in ('libs/MVS/SceneDensify.cpp', 'libs/MVS/SceneRefine.cpp', 'libs/MVS/SceneTexture.cpp'):
                      target = source / rel
                      if target.is_symlink() or not target.is_file():
                          raise ScaffoldError('Missing or unsafe excluded scene file: ' + rel)
                      target.unlink()
                  ignored = frozenset({'.source_info.json', 'build_env.sh', 'conda_build.sh', 'conda_build.log'})
                  count, digest = fingerprint_tree(source, ignore_root_files=ignored)
                  print(f'::notice::PRUNED tree: removed 20 restricted-directory files and 3 excluded scene implementations; retained {count} files; fingerprint {digest}', flush=True)
          '''
          import textwrap
          new = old + textwrap.dedent(new[len(old):]).replace('\n', '\n        ').rstrip() + '\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          compile(path.read_text(), str(path), 'exec')
          PY
      - name: Build, retest and audit with pruned tree, discard all outputs
        env:
          RESEARCH_COMPONENT: openmvs
        run: pixi run python scripts/run_open_research.py
