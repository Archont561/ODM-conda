name: Temporary classification model inspection
on:
  push:
    branches: [arena/207aff2a-odm-conda]
    paths: [.github/workflows/tmp-opc-model.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download upstream model only to runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 /tmp/opc-model
          gh release download v1.1.3 --repo uav4geo/OpenPointClass --pattern vehicles-vegetation-buildings.zip --dir /tmp/opc-model
      - name: Inspect bounded metadata
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('/tmp/opc-model/vehicles-vegetation-buildings.zip')
          with zipfile.ZipFile(p) as z:
              items=z.infolist()
              if len(items)!=1 or items[0].filename!='model.bin' or items[0].is_dir() or items[0].file_size>10_000_000: raise ValueError('unexpected model archive')
              data=z.read(items[0])
          report={'archive_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'model_sha256':hashlib.sha256(data).hexdigest(),'model_bytes':len(data),'model_type':'GBT' if data[:4]==b'tree' else 'random-forest-or-unknown','rights':'not independently established; model discarded'}
          print('::notice::MODEL_REPORT '+json.dumps(report,sort_keys=True))
          PY
