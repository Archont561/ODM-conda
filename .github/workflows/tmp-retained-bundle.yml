name: Temporary research bundle artifact and inspection
on:
  push:
    branches: [arena/bcf4425d-odm-conda]
    paths: [.github/workflows/tmp-retained-bundle.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    outputs:
      manifest_sha: ${{ steps.build.outputs.manifest_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build and validate artifact contents
        id: build
        env:
          TRIAL_MODE: build
        run: |
          set -o pipefail
          pixi run python scripts/tmp_bundle_artifact_trial.py 2>&1 | tee /tmp/build-artifact.log
      - name: Upload temporary research binary bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-odm-research-bundle
          path: /tmp/odm-validated-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/build-artifact.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
  inspect:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Download the exact research artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: temporary-odm-research-bundle
          path: /tmp/odm-validated-bundle
      - name: Verify, replay and test formats
        env:
          TRIAL_MODE: inspect
          MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
        run: |
          set -o pipefail
          {
            python3 -m venv /tmp/fixture-env
            /tmp/fixture-env/bin/pip install 'numpy==1.26.4' 'h5py==3.12.1'
            pixi run python scripts/tmp_bundle_artifact_trial.py
          } 2>&1 | tee /tmp/inspect-artifact.log
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/inspect-artifact.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
