name: Temporary native JPEG XL source rebuild
on:
  push:
    branches: [arena/5c9605f3-odm-conda]
    paths: [.github/workflows/tmp-jxl-native-rebuild.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Rebuild and retest pinned native package privately
        run: |
          set -o pipefail
          pixi run python scripts/tmp_jxl_native_rebuild.py 2>&1 | tee /tmp/jxl-native-rebuild.log
      - name: Failure diagnostic
        if: failure()
        run: |
          grep -E -C 5 'Traceback|AssertionError|Error:|error:' /tmp/jxl-native-rebuild.log | tail -60 | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'
