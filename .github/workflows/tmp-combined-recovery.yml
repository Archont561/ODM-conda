name: Temporary combined evidence recovery
on:
  push:
    branches: [arena/42c6bd76-odm-conda]
    paths: [.github/workflows/tmp-combined-recovery.yml]
permissions:
  actions: read
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Recover bounded evidence from private log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/124181097483/logs > "$RUNNER_TEMP/log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'],'log').read_text(errors='replace')
          hashes=re.findall(r'Actual binary ([^\s]+\.conda) SHA256 ([0-9a-f]{64})',log)
          assert len(hashes)==9 and len(set(n for n,_ in hashes))==9, hashes
          print('::notice::PACKAGES '+ '; '.join(n+' '+s for n,s in hashes))
          for phrase in ('Fresh inventory:', 'Seneca pipeline completed', 'Live GDAL raster sanity checks passed', 'Final raster metadata:'):
              match=re.search(re.escape(phrase)+r'[^\n\r]*',log)
              assert match, phrase
              print('::notice::EVIDENCE '+match.group())
          PY
