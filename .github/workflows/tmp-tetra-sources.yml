name: Temporary TetraFlow dependency sources metadata
on:
  push:
    branches: [arena/5a717834-odm-conda]
    paths: [.github/workflows/tmp-tetra-sources.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Inspect selected binary metadata
        run: |
          set -o pipefail
          pixi run python scripts/tmp_tetra_sources_probe.py 2>&1 | tee /tmp/probe-sources.log
      - name: Failure diagnostic
        if: failure()
        run: |
          tail -40 /tmp/probe-sources.log | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'

# Probe legacy recipe metadata
