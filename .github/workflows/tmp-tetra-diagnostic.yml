name: Temporary TetraFlow dependency diagnostic
on:
  push:
    branches: [arena/7d9eb304-odm-conda]
    paths: [.github/workflows/tmp-tetra-diagnostic.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect dependency metadata in log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/130844573017/logs > /tmp/log
          grep -i 'libjxl' /tmp/log | tail -30 | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'
