name: Temporary TetraFlow diagnostic
on:
  push:
    branches: [arena/8cb0d117-odm-conda]
    paths: [.github/workflows/tmp-tetra-diagnostic.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect bounded error context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Archont561/ODM-conda/actions/jobs/130789727496/logs > /tmp/failed.log 2> /tmp/err || { echo "::notice::$(cat /tmp/err)"; exit 1; }
          grep -i -E -C 3 'error while loading|ReconstructMesh|not found|no such file|matching Conda identities|PASS: locked' /tmp/failed.log | tail -80 | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'
