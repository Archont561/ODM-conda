name: Temporary reduced JPEG XL ODM integration
on:
  push:
    branches: [arena/7579c503-odm-conda]
    paths: [.github/workflows/tmp-odm-jxl-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build, replay and validate private stack
        run: pixi run python scripts/tmp_reduced_jxl_odm.py
