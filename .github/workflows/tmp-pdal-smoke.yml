name: Temporary synthetic PDAL format tests
on:
  push:
    branches: [arena/51de2335-odm-conda]
    paths: [.github/workflows/tmp-pdal-smoke.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build synthetic fixtures and test selected PDAL stack
        run: |
          set -o pipefail
          {
            python3 -m venv /tmp/fixture-env
            /tmp/fixture-env/bin/pip install 'numpy==1.26.4' 'h5py==3.12.1'
            pixi init --format pixi --scm github --channel conda-forge --platform linux-64 /tmp/pdal-project
            pixi add --manifest-path /tmp/pdal-project/pixi.toml 'pdal==2.10.0' 'libgdal-core==3.12.2' 'hdf5==1.14.6' 'libpdal-hdf==2.10.0' 'libpdal-icebridge==2.10.0'
            /tmp/fixture-env/bin/python scripts/pdal_synthetic_formats.py --prefix /tmp/pdal-project/.pixi/envs/default
          } 2>&1 | tee /tmp/pdal-smoke.log
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/pdal-smoke.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'

