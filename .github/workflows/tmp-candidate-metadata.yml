name: Temporary alternate ODM candidate metadata
on:
  push:
    branches: [arena/b398199b-odm-conda]
    paths: [.github/workflows/tmp-candidate-metadata.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build and test private candidate and prepare metadata
        run: pixi run python scripts/tmp_candidate_metadata.py
      - name: Upload metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alternate-odm-candidate-metadata
          path: ${{ runner.temp }}/candidate-metadata/
          if-no-files-found: error
          retention-days: 14
