name: Temporary private batch validation
on:
  push:
    paths: [scripts/poisson_candidate_recipe.py, .github/workflows/tmp-local-batch.yml]
permissions:
  contents: read
jobs:
  poisson:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build private reduced source with truthful metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/OpenDroneMap/PoissonRecon/tar.gz/97caa6d34d1b05b59888bed019dea89ced74445e -o "$RUNNER_TEMP/original.tar.gz"
          pixi run python scripts/poisson_reduced_candidate.py --source "$RUNNER_TEMP/original.tar.gz" --output "$RUNNER_TEMP/a.tar.gz"
          pixi run python scripts/poisson_reduced_candidate.py --source "$RUNNER_TEMP/original.tar.gz" --output "$RUNNER_TEMP/b.tar.gz"
          cmp "$RUNNER_TEMP/a.tar.gz" "$RUNNER_TEMP/b.tar.gz"
          pixi run python scripts/poisson_candidate_recipe.py --original "$RUNNER_TEMP/original.tar.gz" --candidate "$RUNNER_TEMP/a.tar.gz" --destination "$RUNNER_TEMP/prepared"
          pixi run rattler-build build --recipe "$RUNNER_TEMP/prepared/packaging/recipes/poissonrecon-odm/recipe.yaml" --target-platform linux-64 --variant-config recipes/variants.yaml --channel conda-forge --channel-priority strict --output-dir "$RUNNER_TEMP/output" --log-style plain > "$RUNNER_TEMP/build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }
          pixi run python scripts/test_package.py --component poissonrecon-odm --output-dir "$RUNNER_TEMP/output"
          pixi run python - <<'PY'
          import json,os,glob,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"scripts"))
          from package_archive import read_package
          base=Path(os.environ['RUNNER_TEMP'])
          package=Path(glob.glob(str(base/'output/linux-64/poissonrecon-odm-*.conda'))[0])
          _,payload=read_package(package)
          root='share/odm-conda/poissonrecon-odm/'
          prov=json.loads((base/'prepared/RESEARCH-PROVENANCE.json').read_text())
          assert json.loads(payload[root+'upstream.json'])==prov
          text=payload[root+'SOURCE.txt'].decode()
          assert prov['candidate_sha256'] in text and prov['original_archive_sha256'] in text
          assert 'No corresponding-source offer' in text and 'original not included' in text
          print('::notice::Reduced Poisson built and fresh-tested; installed provenance matches candidate and disclaims source offer.')
          PY
          if pixi run python scripts/audit_package.py --component poissonrecon-odm --output-dir "$RUNNER_TEMP/output" --reports-dir "$RUNNER_TEMP/reports" > "$RUNNER_TEMP/audit.log" 2>&1; then
            echo '::error::Production audit unexpectedly accepted research metadata'; exit 1
          fi
          grep -F 'Published corresponding-source URL is missing' "$RUNNER_TEMP/audit.log"
          echo '::notice::Production audit correctly rejected local research metadata; no files uploaded.'
  solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build private real OpenSfM packages and exercise solver
        shell: bash
        run: |
          set -euo pipefail
          for name in opensfm opensfm-scoped; do
            pixi run rattler-build build --recipe "research/recipes/$name-odm/recipe.yaml" --target-platform linux-64 --variant-config recipes/variants.yaml --channel conda-forge --channel-priority strict --output-dir "$RUNNER_TEMP/output" --log-style plain > "$RUNNER_TEMP/$name.log" 2>&1 || { tail -100 "$RUNNER_TEMP/$name.log"; exit 1; }
            package=("$RUNNER_TEMP/output/linux-64/$name-odm-"*.conda)
            pixi run python scripts/audit_open_research.py "$name-odm" "${package[0]}"
          done
          pixi run python - <<'PY'
          import os,subprocess
          from pathlib import Path
          import json
          base=Path(os.environ['RUNNER_TEMP'])
          channel=(base/'output').as_uri()
          pixi=os.environ.get('PIXI_EXE') or 'pixi'
          for label,names in [('full',['opensfm-odm']),('scoped',['opensfm-scoped-odm']),('both',['opensfm-odm','opensfm-scoped-odm'])]:
              work=base/('solve-'+label); work.mkdir()
              deps='\n'.join(f'{name} = "*"' for name in names)
              (work/'pixi.toml').write_text(f'[workspace]\nname = "isolation-{label}"\nchannels = ["{channel}", "conda-forge"]\nplatforms = ["linux-64"]\n\n[dependencies]\n{deps}\n')
              result=subprocess.run([pixi,'lock','--manifest-path',str(work/'pixi.toml')],text=True,capture_output=True)
              output=result.stdout+'\n'+result.stderr
              if label != 'both' and result.returncode:
                  print(output[-10000:]); raise SystemExit('Individual solve failed: '+label)
              if label == 'both' and (result.returncode==0 or not all(name in output for name in names)):
                  print(output[-10000:]); raise SystemExit('Expected explicit solver conflict not observed')
              print('::notice::Solver '+label+(' passed' if label!='both' else ' correctly rejected co-installation'), flush=True)
          PY
          echo '::notice::Both private packages separately built and audited; all outputs discarded.'
