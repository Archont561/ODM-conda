name: Temporary local-only OpenMVS notice input review
on:
  push:
    branches: [arena/17e50690-odm-conda]
    paths: [.github/workflows/tmp-openmvs-notices.yml, scripts/tmp_openmvs_notices.py]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Switch builder to verified reduced tree
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_open_research.py')
          text = path.read_text()
          needle = '        verify_openmvs_tree(source, research=True)\n'
          addition = '''        from openmvs_reduced_tree import make_reduced_tree
                  import tempfile, hashlib, json
                  scratch = Path(tempfile.mkdtemp(prefix='reduced-openmvs-', dir=source.parent))
                  first = scratch / 'first'
                  second = scratch / 'second'
                  manifest = make_reduced_tree(source, first)
                  other = make_reduced_tree(source, second)
                  if manifest != other:
                      raise ScaffoldError('Reduced tree manifests differ')
                  digest = hashlib.sha256(json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
                  print(f"::notice::Reduced copies agree: {manifest['retained_count']} files; tree {manifest['tree_sha256']}; manifest {digest}", flush=True)
                  shutil.rmtree(second)
                  source = first
          '''
          import textwrap
          addition = textwrap.indent(textwrap.dedent(addition), '        ')
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, needle + addition))
          compile(path.read_text(), str(path), 'exec')
          PY
      - name: Build and inspect actual host inputs without uploading
        run: |
          set +e
          pixi run python scripts/tmp_openmvs_notices.py > "$RUNNER_TEMP/notice-review.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            grep -F '::notice::' "$RUNNER_TEMP/notice-review.log" || true
          else
            LOG_FILE="$RUNNER_TEMP/notice-review.log" pixi run python - <<'PYCODE'
          import os,re
          from pathlib import Path
          lines=Path(os.environ['LOG_FILE']).read_text(errors='replace').splitlines()
          print('::error::REVIEW_FAILURE '+re.sub(r'https?://[^\s|]+','[url]',' | '.join(lines[-50:])[-10000:]))
          PYCODE
          fi
          exit "$rc"
