name: Temporary read-only raster metadata recovery
on:
  push:
    branches: [arena/17e50690-odm-conda]
    paths: [.github/workflows/tmp-seneca-readlog.yml]
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Read bounded metadata from completed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api repos/Archont561/ODM-conda/actions/jobs/123797294286/logs > "$RUNNER_TEMP/job.log" 2> "$RUNNER_TEMP/error.log"; then
            echo "::error::Log request failed"
            sed -E 's#https?://[^ ]+#[url]#g' "$RUNNER_TEMP/error.log" | tail -10
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP'],'job.log').read_text(errors='replace').splitlines()
          hits=[line.split('Final raster metadata: ',1)[1] for line in lines if 'Final raster metadata: ' in line]
          assert len(hits)==1, f'expected one metadata line; got {len(hits)} in {len(lines)} log lines'
          data=json.loads(hits[0])
          print('::notice::Recovered raster metadata '+json.dumps(data,separators=(',',':')).replace('\\n',' '))
          checks=[line.split('Final raster exists',1)[1] for line in lines if 'Final raster exists' in line]
          assert len(checks)==1
          print('::notice::Recovered output assertion Final raster exists'+checks[0])
          PY
