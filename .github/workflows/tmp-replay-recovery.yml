name: Temporary dependency snapshot recovery
on:
  push:
    branches: [arena/ba9af306-odm-conda]
    paths: [.github/workflows/tmp-replay-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Recover bounded sanitized metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/124268403590/logs > "$RUNNER_TEMP/log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP'],'log').read_text(errors='replace')
          count_match=re.search(r'DETAIL::SNAPSHOT_COUNT (\d+) PIP (\d+) BYTES (\d+) CHUNKS (\d+)',text)
          assert count_match, 'missing snapshot count'
          count=int(count_match.group(4)); assert 0 < count <= 64, count
          chunks={int(i):c for i,c in re.findall(r'DETAIL::SNAPSHOT_CHUNK_(\d\d) ([A-Za-z0-9+/=]+)',text)}
          assert sorted(chunks)==list(range(count)), sorted(chunks)
          group=int(os.environ['GROUP'])
          for i in range(group*8,min(group*8+8,count)):
              print(f'::notice::SNAPSHOT_CHUNK_{i:02d} {chunks[i]}')
          PY
