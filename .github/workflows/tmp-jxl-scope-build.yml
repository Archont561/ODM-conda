name: Temporary JPEG XL scoped source handoff
on:
  push:
    branches: [arena/b8baf1bb-odm-conda]
    paths: [.github/workflows/tmp-jxl-scope-build.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build pinned independent decoder
        run: |
          git init /tmp/jxl-oxide-build
          git -C /tmp/jxl-oxide-build fetch --depth=1 https://github.com/tirr-c/jxl-oxide.git f8ae722ef2d6b782941c89517d19cfbf605c4a9d
          git -C /tmp/jxl-oxide-build checkout --detach FETCH_HEAD
          test "$(git -C /tmp/jxl-oxide-build rev-parse HEAD)" = f8ae722ef2d6b782941c89517d19cfbf605c4a9d
          cargo build --locked --release --no-default-features -p jxl-oxide-cli --manifest-path /tmp/jxl-oxide-build/Cargo.toml
      - name: Create and replay private source handoff
        run: |
          set -o pipefail
          pixi run python scripts/tmp_jxl_scope_trial.py 2>&1 | tee /tmp/jxl-scope-trial.log
      - name: Failure diagnostic
        if: failure()
        run: |
          grep -E -C 5 'Traceback|AssertionError|ScaffoldError|Error:|error:' /tmp/jxl-scope-trial.log | tail -60 | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'

