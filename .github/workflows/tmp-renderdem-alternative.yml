name: Temporary RenderDEM alternate dependency solve
on:
  push:
    branches: [arena/dc908218-odm-conda]
    paths: [.github/workflows/tmp-renderdem-alternative.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
      - name: Retrieve candidate privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Archont561/ODM-conda/actions/artifacts/13330320942/zip > "$RUNNER_TEMP/original.zip"
      - name: Verify candidate and prepare alternate solve
        run: pixi run python scripts/tmp_renderdem_alternative.py prepare
      - name: Solve and install alternate variants
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime"
          pixi install
      - name: Test candidate and inspect alternate dependencies
        run: pixi run python scripts/tmp_renderdem_alternative.py inspect
      - name: Exercise generated compressed LAZ
        run: pixi run python scripts/validate_renderdem_laz.py --prefix "$RUNNER_TEMP/runtime/.pixi/envs/default"

# Keep annotation count below the per-step limit.

# Inspect alternate spatialite dynamic symbols.
