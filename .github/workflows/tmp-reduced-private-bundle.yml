name: Temporary reduced private ODM builder validation
on:
  push:
    branches: [arena/66ed4e2e-odm-conda]
    paths: [.github/workflows/tmp-reduced-private-bundle.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build, replay, and discard private bundle
        run: pixi run python scripts/tmp_reduced_odm_workflow.py
