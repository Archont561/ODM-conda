name: Temporary private orthophoto build
on:
  push:
    branches: [arena/c9814866-odm-conda]
    paths: [.github/workflows/tmp-orthophoto-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build and test private candidate
        run: |
          set -o pipefail
          pixi run python scripts/private_orthophoto_candidate.py --destination /tmp/odm-orthophoto-private-candidate 2>&1 | tee /tmp/odm-orthophoto-build.log
          python3 -c 'import json,base64,gzip,pathlib;d=json.loads(pathlib.Path("/tmp/odm-orthophoto-private-candidate/receipt.json").read_text());print("::notice::RECEIPT64 "+base64.b64encode(gzip.compress(json.dumps(d,sort_keys=True).encode(),mtime=0)).decode())'
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/odm-orthophoto-build.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
