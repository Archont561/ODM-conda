name: Temporary JPEG XL source and notice review
on:
  push:
    branches: [arena/b8baf1bb-odm-conda]
    paths: [.github/workflows/tmp-jxl-notice-trial.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Verify vendored notices and relocated private rebuild
        run: |
          set -o pipefail
          pixi run python scripts/tmp_jxl_notice_trial.py 2>&1 | tee /tmp/jxl-notice.log
      - name: Failure diagnostic
        if: failure()
        run: |
          grep -E -C 5 'Traceback|AssertionError|Error:|error:' /tmp/jxl-notice.log | tail -60 | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'

# Inspect nested notices and data-file extensions.
