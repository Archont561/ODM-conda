name: Temporary read-only dem2mesh artifact inspection
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Inspect non-published artifact and fresh test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Archont561/ODM-conda/actions/artifacts/12892556037/zip > /tmp/dem-validation.zip
          pixi run python scripts/tmp_dem_inspect.py
