name: Temporary ODM real-data zero test
on:
  push:
    branches: [arena/ef1dec11-odm-conda]
    paths: [.github/workflows/tmp-real-zero.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Rebuild private dependencies, solve, replay and test
        run: |
          set -o pipefail
          pixi run python scripts/tmp_real_zero_trial.py 2>&1 | tee /tmp/odm-zero-build.log
      - name: Failure context
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path
          p=Path('/tmp/odm-zero-build.log')
          text=p.read_bytes()[-12000:] if p.exists() else b'No log available'
          encoded=base64.b64encode(text).decode()
          for i in range(0,len(encoded),2200): print(f'::notice::FAILURE_{i//2200} {encoded[i:i+2200]}')
          PYCODE
# Keep build path short for pip entrypoint shebangs.
