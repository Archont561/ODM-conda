name: Temporary Python candidate evidence
on:
  push:
    branches: [arena/66ed4e2e-odm-conda]
    paths: [.github/workflows/tmp-python-evidence.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        component: [codem, pillow-jxl-plugin, pygltflib, pyodm, pysolar]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
      - name: Build and inspect privately
        env:
          COMPONENT: ${{ matrix.component }}
        run: pixi run python scripts/tmp_python_evidence.py
