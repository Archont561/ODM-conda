name: Temporary scoped OpenSfM package validation
on:
  push:
    branches: [arena/04e0a7c9-odm-conda]
    paths: [.github/workflows/tmp-opensfm-scoped-build.yml, research/recipes/opensfm-scoped-odm/**, scripts/opensfm_scoped_*.py, scripts/audit_open_research.py, scripts/build_open_research.py, scripts/run_open_research.py]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build and test local-only scoped package
        run: |
          set +e
          RESEARCH_COMPONENT=opensfm-scoped pixi run python scripts/run_open_research.py > "$RUNNER_TEMP/scoped.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo '::notice::Scoped OpenSfM package built, installed and fresh-tested and separately audited; all outputs discarded.'
            grep -F 'PASS:' "$RUNNER_TEMP/scoped.log" | tail -15
          else
            LOG_FILE="$RUNNER_TEMP/scoped.log" pixi run python - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path(os.environ['LOG_FILE']).read_text(errors='replace').splitlines()
          print('::error::SCOPED_BUILD_FAILURE '+re.sub(r'https?://[^\s|]+','[url]',' | '.join(lines[-60:])[-10000:]))
          PY
          fi
          exit "$rc"
