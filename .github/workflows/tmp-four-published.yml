name: Temporary four-published-package integration
on:
  push:
    branches: [arena/3dc0b480-odm-conda]
    paths: [.github/workflows/tmp-four-published.yml, scripts/tmp_four_published.py, scripts/tmp_four_inventory.py]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Install published packages and run all four fixtures in the same prefix
        run: pixi run python scripts/tmp_four_published.py
      - name: Capture dependency inventory 1
        run: pixi run python scripts/tmp_four_inventory.py 0 160
      - name: Capture dependency inventory 2
        run: pixi run python scripts/tmp_four_inventory.py 160 322
