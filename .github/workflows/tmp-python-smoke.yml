name: Temporary Python package smoke tests
on:
  push:
    branches: [arena/c9814866-odm-conda]
    paths: [.github/workflows/tmp-python-smoke.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        package: [pysolar, pygltflib]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build and fresh retest
        env:
          NAME: ${{ matrix.package }}
        run: |
          set -o pipefail
          pixi run rattler-build build --recipe "research/recipes/python-source-research/$NAME.yaml" --target-platform linux-64 --variant-config recipes/variants.yaml --channel conda-forge --channel-priority strict --output-dir /tmp/package-output --log-style plain 2>&1 | tee /tmp/python-test.log
          package=(/tmp/package-output/linux-64/odm-research-"$NAME"-*.conda)
          test "${#package[@]}" -eq 1 && test -f "${package[0]}"
          pixi run rattler-build test --package-file "${package[0]}" --channel conda-forge --channel-priority strict --output-dir /tmp/retest --log-style plain 2>&1 | tee -a /tmp/python-test.log
          echo "::notice::PACKAGE $(basename "${package[0]}") $(sha256sum "${package[0]}" | cut -d' ' -f1)"
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/python-test.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
