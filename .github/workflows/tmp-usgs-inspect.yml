name: Temporary USGS metadata and GCP inspection
on:
  push:
    branches: [arena/ef1dec11-odm-conda]
    paths: [.github/workflows/tmp-usgs-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install isolated image inspection dependencies
        run: python3 -m pip install --user pillow==11.3.0 pyproj==3.7.2
      - name: Inspect public USGS metadata and bounded GCP archive
        run: python3 scripts/tmp_usgs_inspect.py
