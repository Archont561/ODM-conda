name: Temporary component inventory log inspection
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read public package inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40935677599 --repo Archont561/ODM-conda --log > "$RUNNER_TEMP/run.txt"
          python3 - "$RUNNER_TEMP/run.txt" <<'PY'
          import base64,json,sys,zlib
          rows=[]
          for line in open(sys.argv[1],errors='replace'):
              if 'FULL-SOLVE ' in line:
                  rows.append(json.loads(line.split('FULL-SOLVE ',1)[1]))
          assert len(rows)==3
          packed=base64.b64encode(zlib.compress(json.dumps(rows,separators=(',',':')).encode(),9)).decode()
          for i in range(0,len(packed),2500):
              print(f'::notice::PART {i//2500:02} '+packed[i:i+2500],flush=True)
          PY
