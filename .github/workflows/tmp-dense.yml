name: Temporary dense OpenMVS research with scene
on:
  push:
    branches: [arena/207aff2a-odm-conda]
    paths: [.github/workflows/tmp-dense.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build, test and audit
        run: |
          set -o pipefail
          pixi run python scripts/tmp_dense_trial.py 2>&1 | tee /tmp/dense.log
      - name: Failure report
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/dense.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-4000:] if p.exists() else b"no log").decode())'
