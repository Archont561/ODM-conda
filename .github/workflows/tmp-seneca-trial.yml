name: Temporary disposable Seneca ODM trial
on:
  push:
    branches: [arena/fd765033-odm-conda]
    paths: [.github/workflows/tmp-seneca-trial.yml, scripts/tmp_seneca_trial.py]
permissions:
  contents: read
  actions: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build, install, run and inspect without uploading outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run python scripts/tmp_seneca_trial.py
