name: Build and test native components

on:
  workflow_dispatch:
    inputs:
      odm:
        description: "ODM private research build and replay (no artifact upload)"
        type: boolean
        default: false
      dem2mesh:
        description: "dem2mesh (leave all unchecked to build all)"
        type: boolean
        default: false
      dem2points:
        description: "dem2points (leave all unchecked to build all)"
        type: boolean
        default: false
      fastrasterfilter:
        description: "fastrasterfilter (leave all unchecked to build all)"
        type: boolean
        default: false
      fpcfilter:
        description: "fpcfilter (leave all unchecked to build all)"
        type: boolean
        default: false
      mvs_texturing_odm:
        description: "mvs-texturing-odm (leave all unchecked to build all)"
        type: boolean
        default: false
      odm_orthophoto:
        description: "odm-orthophoto (leave all unchecked to build all)"
        type: boolean
        default: false
      poissonrecon_odm:
        description: "poissonrecon-odm (leave all unchecked to build all)"
        type: boolean
        default: false
      renderdem:
        description: "renderdem (leave all unchecked to build all)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.odm || inputs.dem2mesh || inputs.dem2points || inputs.fastrasterfilter || inputs.fpcfilter || inputs.mvs_texturing_odm || inputs.odm_orthophoto || inputs.poissonrecon_odm || inputs.renderdem }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SELECT_DEM2MESH: ${{ inputs.dem2mesh }}
      SELECT_DEM2POINTS: ${{ inputs.dem2points }}
      SELECT_FASTRASTERFILTER: ${{ inputs.fastrasterfilter }}
      SELECT_FPCFILTER: ${{ inputs.fpcfilter }}
      SELECT_MVS_TEXTURING_ODM: ${{ inputs.mvs_texturing_odm }}
      SELECT_ODM_ORTHOPHOTO: ${{ inputs.odm_orthophoto }}
      SELECT_POISSONRECON_ODM: ${{ inputs.poissonrecon_odm }}
      SELECT_RENDERDEM: ${{ inputs.renderdem }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Shared local and CI gate
        run: pixi run check
      - name: Build and run packaged tests
        run: pixi run build --workflow-checkboxes
      - name: Retest artifacts in fresh environments
        run: pixi run test --component "$COMPONENT"
      - name: Audit artifacts
        run: pixi run audit --component "$COMPONENT"
      - name: Assemble corresponding-source bundles
        run: pixi run sources --component "$COMPONENT"
      - name: Save non-published artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odm-components-linux-64
          path: |
            output/linux-64/*.conda
            reports/audit-*.json
            source-bundles/source-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  odm-research:
    if: ${{ inputs.odm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Shared local and CI gate
        run: pixi run check
      - name: Build and replay private ODM with Seneca (discard outputs)
        run: pixi run python scripts/run_private_odm_workflow.py
