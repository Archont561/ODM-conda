name: Temporary ODM retest log inspection
on:
  push:
    branches: [arena/e2c792b3-odm-conda]
    paths: [.github/workflows/tmp-odm-retest-log.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read bounded retest log metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/131925351353/logs > /tmp/build-log.txt
          python3 -c 'import base64,re;from pathlib import Path;s=Path("/tmp/build-log.txt").read_text(errors="replace");s=re.sub(r"\x1b\[[0-9;]*[A-Za-z]","",s);p=s.find("PASS: private ODM package test against the assembled channel");assert p>=0;v=s[max(0,p-12000):p];print("::notice::RETEST64 "+base64.b64encode(v[-2400:].encode()).decode())'
