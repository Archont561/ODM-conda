name: Temporary Poisson reduced source validation
on:
  push:
    branches: [arena/17e50690-odm-conda]
    paths: [.github/workflows/tmp-poisson-reduced.yml, scripts/tmp_poisson_jpeg_hashes.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Remove verified vendored JPEG source from disposable build
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p=Path('scripts/build_component.py')
          t=p.read_text()
          marker="        # Upstream's makefiles assign CC/CXX directly, so pass the isolated\n"
          addition='''        import hashlib
                  directory = source / "JPEG"
                  inventory = json.loads((ROOT / "scripts/tmp_poisson_jpeg_hashes.json").read_text())
                  actual = {entry.name for entry in directory.iterdir()}
                  if len(inventory) != 59 or actual != set(inventory) | {"README"}:
                      raise ScaffoldError("Unexpected Poisson JPEG directory contents")
                  for filename, digest in inventory.items():
                      path = directory / filename
                      if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                          raise ScaffoldError("Poisson JPEG inventory mismatch")
                  for filename in inventory:
                      (directory / filename).unlink()
                  if {entry.name for entry in directory.iterdir()} != {"README"}:
                      raise ScaffoldError("Unexpected remaining Poisson JPEG files")
                  print("::notice::Removed all 59 hash-verified vendored JPEG files from disposable staged build; retained candidate README", flush=True)
          '''
          import textwrap
          assert t.count(marker)==1
          t=t.replace(marker,textwrap.indent(textwrap.dedent(addition), '        ')+marker)
          compile(t,str(p),'exec')
          p.write_text(t)
          PYCODE
      - name: Build, fresh test, audit without uploading
        run: |
          set +e
          {
            pixi run build --component poissonrecon-odm --output-dir "$RUNNER_TEMP/poisson-output" &&
            pixi run test --component poissonrecon-odm --output-dir "$RUNNER_TEMP/poisson-output" &&
            pixi run audit --component poissonrecon-odm --output-dir "$RUNNER_TEMP/poisson-output" --reports-dir "$RUNNER_TEMP/reports" &&
            sha256sum "$RUNNER_TEMP"/poisson-output/linux-64/poissonrecon-odm-*.conda
          } > "$RUNNER_TEMP/poisson-log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice::PoissonRecon built after removing vendored JPEG with host-prefix JPEG guard; installed and fresh tests and artifact audit passed. Temporary files were not uploaded."
            grep -E 'PASS:|poissonrecon-odm-.*conda$' "$RUNNER_TEMP/poisson-log" | tail -15
          else
            LOG_FILE="$RUNNER_TEMP/poisson-log" pixi run python - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ['LOG_FILE']).read_text(errors='replace').splitlines()
          print('::error::POISSON_FAILURE ' + re.sub(r'https?://[^\s|]+', '[url]', ' | '.join(lines[-50:])[-10000:]))
          PY
          fi
          exit "$rc"
