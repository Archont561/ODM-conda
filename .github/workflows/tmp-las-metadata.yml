name: Temporary LAS metadata research
on:
  push:
    branches: [arena/c17bf0f2-odm-conda]
    paths: [.github/workflows/tmp-las-metadata.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Solve isolated tools and inspect metadata
        run: |
          pixi init --format pixi --scm github --channel conda-forge --platform linux-64 /tmp/metadata-env
          pixi add --manifest-path /tmp/metadata-env/pixi.toml 'pdal==2.10.0' 'gdal==3.12.2' 'python>=3.12,<3.13'
          /tmp/metadata-env/.pixi/envs/default/bin/python -s -E scripts/tmp_las_metadata_trial.py
