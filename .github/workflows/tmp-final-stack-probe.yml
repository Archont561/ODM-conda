name: Temporary ODM plugin integration validation
on:
  push:
    branches: [arena/1695ed47-odm-conda]
    paths: [.github/workflows/tmp-final-stack-probe.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build and inspect private stack
        run: |
          set -o pipefail
          pixi run python scripts/tmp_final_stack_probe.py 2>&1 | tee /tmp/final-stack-probe.log
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/final-stack-probe.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
