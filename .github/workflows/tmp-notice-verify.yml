name: Temporary OpenMVS notice validation
on:
  push:
    branches: [arena/04e0a7c9-odm-conda]
    paths: [.github/workflows/tmp-notice-verify.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build and verify notices privately
        env:
          RESEARCH_COMPONENT: openmvs
        run: |
          set -euo pipefail
          pixi run python scripts/run_open_research.py > "$RUNNER_TEMP/log" 2>&1 || { tail -120 "$RUNNER_TEMP/log"; exit 1; }
          grep -F 'PASS:' "$RUNNER_TEMP/log" | tail -20
          grep -F 'PASS: openmvs research package SHA256' "$RUNNER_TEMP/log" | sed 's/^/::notice::/'
          echo '::notice::Build 4, installed and fresh tests, payload and six Conda notice hashes passed; outputs discarded.'
