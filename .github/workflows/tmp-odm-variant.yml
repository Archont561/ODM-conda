name: Temporary TetraFlow workflow validation
on:
  push:
    branches: [arena/9ae1b446-odm-conda]
    paths: [.github/workflows/tmp-odm-variant.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      ODM_OPENMVS_VARIANT: tetraflow
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - run: pixi run python -m pytest -q tests/test_private_odm_workflow.py tests/test_multiple_components.py
      - name: Build and replay
        run: |
          set -o pipefail
          pixi run python scripts/run_private_odm_workflow.py 2>&1 | tee /tmp/odm-variant.log
      - name: Failure diagnostics
        if: failure()
        run: |
          tail -60 /tmp/odm-variant.log | python3 -c 'import sys; print("::notice::FAILURE "+sys.stdin.read()[-2800:].replace("%", "%25").replace("\n", "%0A"))'
