name: Temporary JPEG XL source inventory
on:
  push:
    branches: [arena/820f532a-odm-conda]
    paths: [.github/workflows/tmp-jxl-crate-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
      - name: Inspect pinned source privately
        run: pixi run python scripts/tmp_jxl_crate_inventory.py
