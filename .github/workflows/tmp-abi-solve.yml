name: Temporary ABI solver research
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Solve candidate combined ABI in temporary project
        run: |
          pixi init --format pixi --scm github -c conda-forge -p linux-64 "$RUNNER_TEMP/abi-project"
          if ! pixi add --manifest-path "$RUNNER_TEMP/abi-project/pixi.toml" --no-install 'python >=3.12,<3.13' 'libgdal-core >=3.12,<3.13' 'libpdal-core >=2.10,<2.11' 'pdal' 'python-pdal' 'gdal' 'libopencv >=4.12,<4.13' 'py-opencv >=4.12,<4.13' 'libboost >=1.90,<1.91' 'tbb >=2023.1,<2024' 'libpng >=1.6.59,<1.7' 'ceres-solver' 'rasterio' 'exiftool' > "$RUNNER_TEMP/abi-solve.log" 2>&1; then
            python -c 'from pathlib import Path; import os; s=Path(os.environ["RUNNER_TEMP"],"abi-solve.log").read_text(); print("::error::solve failed " + s[:9000].replace("\n"," | "))'
            exit 1
          fi
          pixi list --manifest-path "$RUNNER_TEMP/abi-project/pixi.toml" --locked > "$RUNNER_TEMP/abi-list.log"
          python -c 'from pathlib import Path; import os; s=Path(os.environ["RUNNER_TEMP"],"abi-list.log").read_text(); print("::notice::Selected ABI rows " + " | ".join(x for x in s.splitlines() if any(n in x for n in ("libgdal-core", "libpdal-core", "python-pdal", "libopencv", "py-opencv", "libboost", "tbb", "libpng", "ceres-solver", "rasterio"))))'
