name: Temporary private JPEG XL source build
on:
  push:
    branches: [arena/1a7c5c8e-odm-conda]
    paths: [.github/workflows/tmp-jxl-source.yml, scripts/tmp_jxl_source.py]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Prepare, build and test JPEG XL privately
        run: pixi run python scripts/tmp_jxl_source.py
