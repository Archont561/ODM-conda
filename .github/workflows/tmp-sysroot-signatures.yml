name: Temporary sysroot RPM signatures
on:
  push:
    branches: [arena/870d0657-odm-conda]
    paths: [.github/workflows/tmp-sysroot-signatures.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - run: python3 scripts/tmp_sysroot_signatures.py
