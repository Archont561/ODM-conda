name: Temporary alternative OpenMVS guard trial
on:
  push:
    branches: [arena/8cb0d117-odm-conda]
    paths: [.github/workflows/tmp-openmvs-tetraflow.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Private build and retest
        run: |
          set -o pipefail
          pixi run python scripts/tmp_openmvs_tetraflow.py 2>&1 | tee /tmp/trial.log
      - name: Failure diagnostic
        if: failure()
        run: |
          tail -80 /tmp/trial.log | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'
