name: Temporary reduced research runner validation
on:
  push:
    branches: [arena/14f7b1a7-odm-conda]
    paths: [.github/workflows/tmp-reduced-runner.yml, scripts/run_reduced_research.py]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [poisson, opensfm, openmvs]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build, fresh-test and audit without upload
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          pixi run python scripts/run_reduced_research.py --component "$COMPONENT" > "$RUNNER_TEMP/log" 2>&1 || { tail -120 "$RUNNER_TEMP/log"; exit 1; }
          grep -F 'PASS:' "$RUNNER_TEMP/log" | tail -20
          grep -F 'reduced research package SHA256' "$RUNNER_TEMP/log" | sed 's/^/::notice::/'
          echo "::notice::${COMPONENT} private reduced build, fresh test and research audit passed; outputs discarded."
