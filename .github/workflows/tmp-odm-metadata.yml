name: Temporary ODM research metadata
on:
  push:
    branches: [arena/7a9079ec-odm-conda]
    paths: [.github/workflows/tmp-odm-metadata.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    outputs:
      lock_sha256: ${{ steps.build.outputs.lock_sha256 }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
      inventory_sha256: ${{ steps.build.outputs.inventory_sha256 }}
      package_count: ${{ steps.build.outputs.package_count }}
      artifact_url: ${{ steps.metadata.outputs.artifact-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build, replay and select lightweight metadata
        id: build
        run: pixi run python scripts/tmp_odm_metadata_run.py
      - name: Save explicitly selected metadata only
        id: metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odm-research-metadata
          path: |
            ${{ runner.temp }}/odm-metadata/pixi.toml
            ${{ runner.temp }}/odm-metadata/pixi.lock
            ${{ runner.temp }}/odm-metadata/conda-inventory.json
            ${{ runner.temp }}/odm-metadata/private-bundle.json
            ${{ runner.temp }}/odm-metadata/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
