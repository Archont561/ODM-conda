name: Temporary TetraFlow metadata probe
on:
  push:
    branches: [arena/5a717834-odm-conda]
    paths: [.github/workflows/tmp-tetra-metadata.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build and inspect metadata only
        run: |
          set -o pipefail
          pixi run python scripts/tmp_tetra_metadata_probe.py 2>&1 | tee /tmp/probe.log
      - name: Emit metadata part 1
        run: |
          python - <<'PYCODE'
          import base64, zlib
          data = base64.b64encode(zlib.compress(open('/tmp/tetra-metadata.json', 'rb').read(), 9)).decode()
          chunks = [data[i:i+2500] for i in range(0, len(data), 2500)]
          if len(chunks) > 20: raise SystemExit('metadata relay exceeds bounded notices')
          for i, chunk in enumerate(chunks[:10]): print(f'::notice::TETRA-C{i:02d}-OF-{len(chunks):02d}:{chunk}')
          PYCODE
      - name: Emit metadata part 2
        run: |
          python - <<'PYCODE'
          import base64, zlib
          data = base64.b64encode(zlib.compress(open('/tmp/tetra-metadata.json', 'rb').read(), 9)).decode()
          chunks = [data[i:i+2500] for i in range(0, len(data), 2500)]
          if len(chunks) > 20: raise SystemExit('metadata relay exceeds bounded notices')
          for i, chunk in enumerate(chunks[10:], 10): print(f'::notice::TETRA-C{i:02d}-OF-{len(chunks):02d}:{chunk}')
          PYCODE
      - name: Failure diagnostic
        if: failure()
        run: |
          tail -60 /tmp/probe.log | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'

