name: Temporary private handoff verification
on:
  push:
    branches: [arena/c9814866-odm-conda]
    paths: [.github/workflows/tmp-verify-handoff.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Assemble and verify private handoff
        run: |
          set -o pipefail
          pixi run python scripts/private_orthophoto_candidate.py --destination /tmp/candidate-handoff 2>&1 | tee /tmp/handoff.log
          sha=$(sha256sum /tmp/candidate-handoff/receipt.json | cut -d' ' -f1)
          pixi run python scripts/verify_private_orthophoto_candidate.py --directory /tmp/candidate-handoff --receipt-sha256 "$sha" 2>&1 | tee -a /tmp/handoff.log
          python3 -c 'import base64,json,pathlib; p=pathlib.Path("/tmp/candidate-handoff/receipt.json");d=json.loads(p.read_text()); import hashlib; print("::notice::RECEIPT64 "+base64.b64encode(json.dumps({"receipt_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"package":d["package"],"source_bundle":d["source_bundle"]},sort_keys=True).encode()).decode())'
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/handoff.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
