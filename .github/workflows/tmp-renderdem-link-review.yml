name: Temporary RenderDEM link review
on:
  push:
    branches: [arena/9c6e6ab9-odm-conda]
    paths: [.github/workflows/tmp-renderdem-link-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
      - name: Retrieve retained candidate privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Archont561/ODM-conda/actions/artifacts/13330320942/zip > "$RUNNER_TEMP/original.zip"
      - name: Verify candidate and prepare local channel
        run: pixi run python scripts/tmp_renderdem_link_review.py prepare
      - name: Install candidate and dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime"
          pixi install
      - name: Inspect selected ELF dynamic metadata
        run: pixi run python scripts/tmp_renderdem_link_review.py inspect
