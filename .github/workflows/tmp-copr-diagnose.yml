name: Temporary COPR diagnosis
on:
  push:
    branches: [arena/b398199b-odm-conda]
    paths: [.github/workflows/tmp-copr-diagnose.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize failed run tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 42395352751 --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log"
          python - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'failed.log').read_text(errors='replace').splitlines()
          for line in lines[-23:]:
              text = line.split('\t', 2)[-1].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('COPR-TAIL ' + text[:1500])
          import json
          tail = '\n'.join(line.split('\t', 2)[-1] for line in lines[-23:])
          print('::notice::COPR-ERROR ' + json.dumps(tail)[1:-1][:3000])
          PY
