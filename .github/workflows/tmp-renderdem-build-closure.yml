name: Temporary RenderDEM release inventory staging test
on:
  push:
    branches: [arena/3be03caa-odm-conda]
    paths: [.github/workflows/tmp-renderdem-build-closure.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
      - name: Build and test
        run: pixi run build --component renderdem --keep-renderdem-build
      - name: Retest
        run: pixi run test --component renderdem
      - name: Audit
        run: pixi run audit --component renderdem
      - name: Stage candidate and inventory
        run: pixi run stage-release --component renderdem --capture-renderdem-inventory
      - name: Verify stage and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          test -s build-host-inventory.json
          grep -Eq '^[0-9a-f]{64}  build-host-inventory[.]json$' SHA256SUMS
          sha256sum --strict --check SHA256SUMS
          python3 -c 'import glob,hashlib,json; x=json.load(open("build-host-inventory.json")); p=glob.glob("renderdem-*.conda"); assert len(p)==1 and x["package"]==p[0] and x["package_sha256"]==hashlib.sha256(open(p[0],"rb").read()).hexdigest() and all(x["environments"][v]["packages"] for v in ("build","host")); print("::notice::Staged build/host inventory matches trial package; checksums passed; no artifacts uploaded.")'
      - name: Inspect exact selected build package metadata
        run: pixi run python scripts/tmp_inspect_build_packages.py
