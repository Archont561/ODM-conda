name: Temporary private ODM format integration
on:
  push:
    branches: [arena/51de2335-odm-conda]
    paths: [.github/workflows/tmp-pdal-full-stack.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Validate private ODM and synthetic formats
        run: |
          set -o pipefail
          {
            python3 -m venv /tmp/fixture-env
            /tmp/fixture-env/bin/pip install 'numpy==1.26.4' 'h5py==3.12.1'
            pixi run python scripts/tmp_pdal_full_stack.py
          } 2>&1 | tee /tmp/pdal-full-stack.log
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64;from pathlib import Path;p=Path("/tmp/pdal-full-stack.log");print("::notice::FAILURE64 "+base64.b64encode(p.read_bytes()[-3000:] if p.exists() else b"no log").decode())'
