name: Temporary evidence summary
on:
  push:
    branches: [arena/1a7c5c8e-odm-conda]
    paths: [.github/workflows/tmp-recover.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize private test evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 41145494232 --repo Archont561/ODM-conda --log > /tmp/run.txt
          grep -E 'PASS: [0-9]+ matching Conda|PASS: private|PASS: locked private|Record this manifest|Prepared [0-9]+ locked registry' /tmp/run.txt | sed -E 's/^.{0,180}(PASS:|Record this manifest|Prepared)/\1/' | while IFS= read -r line; do echo "::notice::$line"; done
