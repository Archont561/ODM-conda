name: Temporary ODM split pointcloud research
on:
  push:
    branches: [arena/207aff2a-odm-conda]
    paths: [.github/workflows/tmp-odm-split.yml]
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: temporary-odm-research-bundle
          path: /tmp/odm-research-bundle
          run-id: 43518311868
          github-token: ${{ github.token }}
      - name: Download model privately on runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 /tmp/opc-model
          gh release download v1.1.3 --repo uav4geo/OpenPointClass --pattern vehicles-vegetation-buildings.zip --dir /tmp/opc-model
      - name: Build, solve, replay and process
        run: |
          set -o pipefail
          pixi run python scripts/tmp_odm_split_trial.py 2>&1 | tee /tmp/odm-dense-integration.log
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 -c 'import base64,re;from pathlib import Path;p=Path("/tmp/odm-dense-integration.log");s=p.read_text(errors="replace") if p.exists() else "no log";lines=[re.sub(r"\x1b\[[0-9;]*m","",x) for x in s.splitlines() if re.search(r"FPCFilter|error|failed|finite|invalid|exception|scene_dense|point.?cloud",x,re.I)];print("::notice::FAILURE64 "+base64.b64encode(chr(10).join(lines[-22:]).encode()[-2200:]).decode())'
# Retry with prefix set for installed module probe.
