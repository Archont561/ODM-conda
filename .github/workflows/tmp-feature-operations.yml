name: Temporary dependency operation tests
on:
  push:
    branches: [arena/b398199b-odm-conda]
    paths: [.github/workflows/tmp-feature-operations.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [reduced, full]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
      - name: Test operations on disposable environments
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lzop
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          mkdir "$d/input" "$d/empty-path"
          printf 'ODM variant archive fixture\n' > "$d/input/fixture.txt"
          tar -cf "$d/fixture.tar" -C "$d/input" fixture.txt
          lzop -c "$d/fixture.tar" > "$d/fixture.tar.lzo"
          pixi init --format pixi --channel conda-forge --platform linux-64 "$d/project"
          if [ "$FAMILY" = reduced ]; then
            spatialite=lgpl_h6633a9c_19
            archive=lgpl_hee3b6c9_0
          else
            spatialite=gpl_h2988700_122
            archive=gpl_h3152399_100
          fi
          cat >> "$d/project/pixi.toml" <<END
          python = "3.12.*"
          libspatialite = { version = "==5.1.0", build = "$spatialite" }
          libarchive = { version = "==3.8.11", build = "$archive" }
          END
          pixi install --manifest-path "$d/project/pixi.toml"
          FIXTURE="$d/fixture.tar.lzo" EMPTY_PATH="$d/empty-path" pixi run --manifest-path "$d/project/pixi.toml" python "$GITHUB_WORKSPACE/scripts/tmp_feature_operations.py"
