name: Temporary reduced Poisson candidate build
on:
  push:
    branches: [arena/04e0a7c9-odm-conda]
    paths: [.github/workflows/tmp-poisson-candidate.yml, scripts/poisson_reduced_candidate.py, tests/test_poisson_reduced_candidate.py]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Reproduce candidate and build privately
        run: |
          set +e
          {
            curl -fsSL https://codeload.github.com/OpenDroneMap/PoissonRecon/tar.gz/97caa6d34d1b05b59888bed019dea89ced74445e -o "$RUNNER_TEMP/original.tar.gz" &&
            pixi run python scripts/poisson_reduced_candidate.py --source "$RUNNER_TEMP/original.tar.gz" --output "$RUNNER_TEMP/candidate1.tar.gz" &&
            pixi run python scripts/poisson_reduced_candidate.py --source "$RUNNER_TEMP/original.tar.gz" --output "$RUNNER_TEMP/candidate2.tar.gz" &&
            cmp "$RUNNER_TEMP/candidate1.tar.gz" "$RUNNER_TEMP/candidate2.tar.gz" &&
            mkdir "$RUNNER_TEMP/unpacked" && tar xzf "$RUNNER_TEMP/candidate1.tar.gz" -C "$RUNNER_TEMP/unpacked" &&
            pixi run python - <<'PY' &&
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'unpacked'
          manifest=json.loads((root/'CANDIDATE-MANIFEST.json').read_text())
          assert len(manifest['excluded_files'])==59
          for name,digest in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          assert list((root/'source/JPEG').iterdir())==[]
          recipe=root/'packaging/recipes/poissonrecon-odm/recipe.yaml'
          text=recipe.read_text()
          url='  url: https://codeload.github.com/OpenDroneMap/PoissonRecon/tar.gz/97caa6d34d1b05b59888bed019dea89ced74445e\n'
          sha='  sha256: $' + '{{ source_sha256 }}\n'
          assert text.count(url)==text.count(sha)==1
          text=text.replace(url, f'  path: {root / "source"}\n').replace(sha,'')
          recipe.write_text(text)
          print('::notice::Two candidate archives matched; manifest hashes verified, source JPEG directory empty; source recipe adapted locally',flush=True)
          PY
            pixi run rattler-build build --recipe "$RUNNER_TEMP/unpacked/packaging/recipes/poissonrecon-odm/recipe.yaml" --target-platform linux-64 --variant-config "$RUNNER_TEMP/unpacked/packaging/recipes/variants.yaml" --channel conda-forge --channel-priority strict --output-dir "$RUNNER_TEMP/output" --log-style plain &&
            pixi run python scripts/test_package.py --component poissonrecon-odm --output-dir "$RUNNER_TEMP/output" &&
            pixi run python scripts/audit_package.py --component poissonrecon-odm --output-dir "$RUNNER_TEMP/output" --reports-dir "$RUNNER_TEMP/reports"
          } > "$RUNNER_TEMP/candidate-build.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice::Candidate source built; installed and fresh tests and normal artifact audit passed. No files uploaded."
            grep -F '::notice::' "$RUNNER_TEMP/candidate-build.log" || true
            sha256sum "$RUNNER_TEMP/candidate1.tar.gz"
          else
            LOG_FILE="$RUNNER_TEMP/candidate-build.log" pixi run python - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path(os.environ['LOG_FILE']).read_text(errors='replace').splitlines()
          print('::error::CANDIDATE_FAILURE '+re.sub(r'https?://[^\s|]+','[url]',' | '.join(lines[-50:])[-10000:]))
          PY
          fi
          exit "$rc"
