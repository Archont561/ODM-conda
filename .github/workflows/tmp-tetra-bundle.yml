name: Temporary TetraFlow private bundle trial
on:
  push:
    branches: [arena/7d9eb304-odm-conda]
    paths: [.github/workflows/tmp-tetra-bundle.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Obtain pinned crate
        run: curl -fsSL https://static.crates.io/crates/jpegxl-src/jpegxl-src-0.11.2.crate -o /tmp/jpegxl-src-0.11.2.crate
      - name: Build and replay privately
        run: |
          set -o pipefail
          pixi run python scripts/tmp_tetra_bundle_trial.py 2>&1 | tee /tmp/tetra-bundle.log
      - name: Failure diagnostic
        if: failure()
        run: |
          tail -80 /tmp/tetra-bundle.log | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'
