name: Temporary COPR GCP FLANN alternate-variant validation
on:
  push:
    branches: [arena/b398199b-odm-conda]
    paths: [.github/workflows/tmp-odm-alt-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Build, replay and test private alternate-variant ODM
        run: pixi run python scripts/tmp_run_private_odm_alt.py
