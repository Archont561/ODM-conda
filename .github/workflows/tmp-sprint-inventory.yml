name: Temporary fresh environment inventory
on:
  push:
    branches: [arena/14f7b1a7-odm-conda]
    paths: [.github/workflows/tmp-sprint-inventory.yml, scripts/tmp_inventory_trial.py]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build private variants and inventory fresh environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run python scripts/tmp_inventory_trial.py
