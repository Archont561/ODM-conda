name: Temporary OpenVINO combined validation
on:
  push:
    branches: [arena/1d04b5db-odm-conda]
    paths: [.github/workflows/tmp-openvino-trial.yml, scripts/tmp_openvino_trial.py]
permissions:
  contents: read
  actions: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build, solve and privately run integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: pixi run python scripts/tmp_openvino_trial.py
  quick-solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          run-install: false
      - name: Test OpenCV and newer OpenVINO solver constraints
        run: |
          set -euo pipefail
          pixi init --format pixi --scm none --channel conda-forge --platform linux-64 "$RUNNER_TEMP/solve"
          pixi add --manifest-path "$RUNNER_TEMP/solve/pixi.toml" 'python >=3.12,<3.13' 'libopencv >=4.12,<4.13' 'py-opencv >=4.12,<4.13' 'libopenvino >=2026.0'
          pixi list --manifest-path "$RUNNER_TEMP/solve/pixi.toml" --locked | grep -E 'libopencv|py-opencv|libopenvino'
