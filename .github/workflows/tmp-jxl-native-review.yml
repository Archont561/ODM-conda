name: Temporary JPEG XL native source review
on:
  push:
    branches: [arena/5c9605f3-odm-conda]
    paths: [.github/workflows/tmp-jxl-native-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default agent-tools
      - name: Inspect exact historical native packages privately
        run: |
          set -o pipefail
          pixi run python scripts/tmp_jxl_native_review.py 2>&1 | tee /tmp/jxl-native-review.log
      - name: Failure diagnostic
        if: failure()
        run: |
          tail -35 /tmp/jxl-native-review.log | python -c 'import sys; print("::notice::"+sys.stdin.read()[-3000:].replace("%", "%25").replace("\n", "%0A"))'

