name: Temporary OpenVINO evidence recovery
on:
  push:
    branches: [arena/1d04b5db-odm-conda]
    paths: [.github/workflows/tmp-openvino-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Recover alternative solver identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/124208393728/logs > "$RUNNER_TEMP/log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP'],'log').read_text(errors='replace').splitlines()
          lines=[re.sub(r'\x1b\[[0-9;]*m','',x) for x in lines]
          results=[x.split('Z ',1)[-1].strip() for x in lines if re.search(r'\b(?:libopencv|py-opencv|libopenvino)\s+\d',x)]
          assert results, 'no solver records'
          print('::notice::ALTERNATIVE_SOLVE '+' | '.join(results)[-3500:])
          PY
