name: Temporary OpenVINO evidence recovery
on:
  push:
    branches: [arena/1d04b5db-odm-conda]
    paths: [.github/workflows/tmp-openvino-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Recover sanitized archive inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/124210139239/logs > "$RUNNER_TEMP/log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'],'log').read_text(errors='replace')
          match=re.search(r'RESULT_COUNT 14 CHUNKS (\d+)',s); assert match
          count=int(match.group(1)); assert 0 < count <= 8
          found=dict((int(i),v) for i,v in re.findall(r'OPENVINO_CHUNK_(\d\d) ([A-Za-z0-9+/=]+)',s))
          assert sorted(found)==list(range(count)), sorted(found)
          for i in range(count): print(f'::notice::OPENVINO_CHUNK_{i:02d} {found[i]}')
          PY
