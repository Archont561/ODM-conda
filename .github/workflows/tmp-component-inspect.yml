name: Temporary read-only component inspection
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Verify non-published artifacts and fresh tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Archont561/ODM-conda/actions/artifacts/12892015321/zip > /tmp/artifact-dem.zip
          gh api repos/Archont561/ODM-conda/actions/artifacts/12884831960/zip > /tmp/artifact-batch.zip
          pixi run python scripts/tmp_component_inspect.py
          gh run view 40844694283 --log > /tmp/historical.log
          python - <<'PY'
          import re
          text = open('/tmp/historical.log').read().splitlines()
          matches = [line for line in text if re.search(r'libpdal-core\s+2\.10\.', line)]
          for line in list(dict.fromkeys(matches))[:8]:
              print('::notice::Historical PDAL solve line: ' + line[-350:])
          PY
