name: Temporary four-component gate evidence
on:
  push:
    branches: [arena/7a9079ec-odm-conda]
    paths: [.github/workflows/tmp-four-gates.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        component: [dem2mesh, renderdem, poissonrecon-odm, mvs-texturing-odm]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up locked Pixi tooling
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default
      - name: Build and run packaged tests
        run: pixi run build --component "$COMPONENT"
      - name: Retest in fresh environment
        run: pixi run test --component "$COMPONENT"
      - name: Audit package
        run: pixi run audit --component "$COMPONENT"
      - name: Prepare local-only source bundle
        run: pixi run sources --component "$COMPONENT"
      - name: Summarize verified evidence, without uploading inputs
        run: pixi run python scripts/tmp_four_gate_evidence.py
