name: Temporary candidate hash recovery
on:
  push:
    branches: [arena/04e0a7c9-odm-conda]
    paths: [.github/workflows/tmp-candidate-log.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read candidate build hash only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/Archont561/ODM-conda/actions/jobs/123814351442/logs > "$RUNNER_TEMP/log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP'],'log').read_text(errors='replace')
          hashes=re.findall(r'([0-9a-f]{64})\s+[^\s]*candidate1\.tar\.gz', text)
          assert len(hashes)==1, hashes
          print('::notice::Candidate archive SHA256 '+hashes[0])
          PY
