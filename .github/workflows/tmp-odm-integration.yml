name: Temporary ODM dataset failure diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Read completed run diagnostics without saving artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40916199152 --repo Archont561/ODM-conda --log > "$RUNNER_TEMP/log.txt"
          python3 - "$RUNNER_TEMP/log.txt" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors='replace').read().splitlines()
          matches=[i for i,l in enumerate(s) if 'Starting incremental reconstruction' in l]
          assert matches
          a=matches[0]
          for i in range(a,min(a+140,len(s)),30):
              block=[]
              for line in s[i:i+30]:
                  line=re.sub(r'^.*?\d{4}-\d\d-\d\dT\S+\s+','',line)
                  block.append(line)
              print('::notice::RECONSTRUCTION '+str(i-a)+': '+' | '.join(block),flush=True)
          PY
