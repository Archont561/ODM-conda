name: Temporary local-only ODM solve diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Analyze completed integration solve log without uploading it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40911981703 --log > "$RUNNER_TEMP/integration.log"
          python3 scripts/tmp_odm_solve_diagnostic.py "$RUNNER_TEMP/integration.log"
