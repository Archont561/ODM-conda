# Local research only: repackages the exact upstream wheel, not a source build.
schema_version: 1
package:
  name: odm-research-codem
  version: "0.26.1"
source:
  url: https://files.pythonhosted.org/packages/07/c6/11dc60a2a859faf393a2ec2d5cd3fb73b1a628f9786f67ee9af555b72e04/codem-0.26.1-py3-none-any.whl
  sha256: 9e18a8a516c7f1d4ba00fcc5a6d13f348a7193862450b072089895f3d1f0b3b2
build:
  number: 0
  string: research_${{ hash }}_0
  skip: target_platform != "linux-64"
  script:
    interpreter: python
    content: |
      import os, subprocess, sys
      from pathlib import Path
      wheels = list(Path(os.environ['SRC_DIR']).glob('*.whl'))
      assert len(wheels) == 1, wheels
      subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--no-index', '--no-build-isolation', '--prefix', os.environ['PREFIX'], str(wheels[0])], check=True)
requirements:
  build:
    - python >=3.12,<3.13
    - pip
  host:
    - python >=3.12,<3.13
  run:
    - python >=3.12,<3.13
    - typing-extensions
    - pyyaml
    - rich
    - python-json-logger
    - websocket-client
    - py-opencv
    - numpy
    - matplotlib
    - python-pdal
    - pdal
    - pyproj
    - rasterio
    - trimesh
    - scipy
    - scikit-image
    - pandas
    - pyshp
    - setuptools
tests:
  - script:
      interpreter: python
      content: |
        import codem
    requirements:
      run:
        - python >=3.12,<3.13
about:
  homepage: https://pypi.org/project/codem/
  summary: Private research wheel repack, not approved for distribution
  license: LicenseRef-Unreviewed
