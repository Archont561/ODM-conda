# Local research only: repackages the exact upstream wheel, not a source build.
schema_version: 1
package:
  name: odm-research-pyodm
  version: "1.5.12"
source:
  url: https://files.pythonhosted.org/packages/91/54/26ce63fb4bbcadf2cd113a5204385224736cd2e163272f392683928ed3c8/pyodm-1.5.12-py3-none-any.whl
  sha256: b235de263f82063326694d3e3e0c027d4b658d06f01473e84093fbd4d7a6eef5
build:
  number: 0
  string: research_${{ hash }}_0
  skip: target_platform != "linux-64"
  script:
    interpreter: python
    content: |
      import os, subprocess, sys
      from pathlib import Path
      wheels = list(Path(os.environ['SRC_DIR']).glob('*.whl'))
      assert len(wheels) == 1, wheels
      subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--no-index', '--no-build-isolation', '--prefix', os.environ['PREFIX'], str(wheels[0])], check=True)
requirements:
  build:
    - python >=3.12,<3.13
    - pip
  host:
    - python >=3.12,<3.13
  run:
    - python >=3.12,<3.13
    - requests
    - requests-toolbelt
    - urllib3
tests:
  - script:
      interpreter: python
      content: |
        import pyodm
    requirements:
      run:
        - python >=3.12,<3.13
about:
  homepage: https://github.com/OpenDroneMap/PyODM
  summary: Private research wheel repack, not approved for distribution
  license: LicenseRef-Unreviewed
