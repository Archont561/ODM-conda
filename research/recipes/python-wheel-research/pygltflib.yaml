# Local research only: repackages the exact upstream wheel, not a source build.
schema_version: 1
package:
  name: odm-research-pygltflib
  version: "1.16.5"
source:
  url: https://files.pythonhosted.org/packages/91/d6/7eb8a0e4eb30add2b76c957a41107a5f2ba26472d656e2733728bec0476b/pygltflib-1.16.5-py3-none-any.whl
  sha256: 41d3349c59dcf1586faeaee29c967be07ac2bf7cecdb8ae2b527da1f25afdaac
build:
  number: 0
  string: research_${{ hash }}_0
  skip: target_platform != "linux-64"
  script:
    interpreter: python
    content: |
      import os, subprocess, sys
      from pathlib import Path
      wheels = list(Path(os.environ['SRC_DIR']).glob('*.whl'))
      assert len(wheels) == 1, wheels
      subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--no-index', '--no-build-isolation', '--prefix', os.environ['PREFIX'], str(wheels[0])], check=True)
requirements:
  build:
    - python >=3.12,<3.13
    - pip
  host:
    - python >=3.12,<3.13
  run:
    - python >=3.12,<3.13
    - dataclasses-json
    - deprecated
tests:
  - script:
      interpreter: python
      content: |
        import pygltflib
    requirements:
      run:
        - python >=3.12,<3.13
about:
  homepage: https://gitlab.com/dodgyville/pygltflib
  summary: Private research wheel repack, not approved for distribution
  license: LicenseRef-Unreviewed
