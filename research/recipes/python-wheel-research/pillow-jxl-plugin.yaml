# Local research only: repackages the exact upstream wheel, not a source build.
schema_version: 1
package:
  name: odm-research-pillow-jxl-plugin
  version: "1.3.4"
source:
  url: https://files.pythonhosted.org/packages/48/ba/9eaafa6446859bc4a60fc1b0de4447fa6fd0e705d4a915b5a8035b75ec63/pillow_jxl_plugin-1.3.4-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
  sha256: 11b33c91e866b65b2dcdd267811a65feab5395037cbb2dc5837b3826465749db
build:
  number: 0
  string: research_${{ hash }}_0
  skip: target_platform != "linux-64"
  script:
    interpreter: python
    content: |
      import os, subprocess, sys
      from pathlib import Path
      wheels = list(Path(os.environ['SRC_DIR']).glob('*.whl'))
      assert len(wheels) == 1, wheels
      subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--no-index', '--no-build-isolation', '--prefix', os.environ['PREFIX'], str(wheels[0])], check=True)
requirements:
  build:
    - python >=3.12,<3.13
    - pip
  host:
    - python >=3.12,<3.13
  run:
    - python >=3.12,<3.13
    - packaging
    - pillow
tests:
  - script:
      interpreter: python
      content: |
        import pillow_jxl
    requirements:
      run:
        - python >=3.12,<3.13
about:
  homepage: https://pypi.org/project/pillow-jxl-plugin/
  summary: Private research wheel repack, not approved for distribution
  license: LicenseRef-Unreviewed
