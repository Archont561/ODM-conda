# Private CPU dense prototype: not full ODM, release or source completeness.
schema_version: 1
package:
  name: odm-dense-research
  version: "3.6.2"
source:
  url: https://codeload.github.com/OpenDroneMap/ODM/tar.gz/47f41f1f2d09f7c15dff33dd3c15ab29c8a97d45
  sha256: 5bdf8fe81b9ca47714e8a474139fd206b8090ac4315c2f530a58fcaef29cde5e
  patches:
    - patches/0001-prefix.patch
build:
  number: 1
  string: research_cpu_dense_${{ hash }}_1
  skip: target_platform != "linux-64"
  python:
    skip_pyc_compilation:
      - share/odm-conda/**/*.py
  script:
    file: ../../../scripts/build_odm_dense_research.py
    interpreter: python
requirements:
  build:
    - python >=3.12,<3.13
  run:
    - python >=3.12,<3.13
    - odm-research-pyodm ==1.5.12 research_*_1
    - odm-research-pysolar ==0.13 research_*_1
    - odm-research-pillow-jxl-plugin ==1.3.4 research_vendor_scope_*_3
    - odm-research-pygltflib ==1.16.5 research_*_1
    - odm-research-codem ==0.26.1 research_*_1
    - opensfm-scoped-odm ==0.5.2 research_*
    - openmvs-dense-research ==0.0.0.dev20260827 research_cpucompat_*_2
    - dem2mesh ==0.0.0.dev20231207 research_*_1
    - poissonrecon-odm ==13.8 research_*
    - fpcfilter ==0.2 research_*
    - dem2points ==0.0.0.dev20220721 research_*
    - fastrasterfilter ==1.0 research_*
    - renderdem ==1.0 research_*
    - mvs-texturing-odm ==0.0.0.dev20250818 research_*
    - odm-orthophoto ==0.0.0.dev20250225 candidate_opencv413_*_3
    - pdal
    - python-pdal
    - gdal
    - exiftool
    - scikit-image
    - scikit-learn
    - shapely
    - fiona
    - edt
    - piexif
    - trimesh
    - onnxruntime
    - packaging
    - libopenvino >=2026.0
tests:
  - package_contents:
      files:
        - bin/odm-dense-research
        - share/odm-conda/odm-dense-research/app/run.py
        - share/odm-conda/odm-dense-research/app/VERSION
        - share/odm-conda/odm-dense-research/app/LOCAL-ONLY.txt
  - script:
      interpreter: python
      content: |
        import subprocess, sys
        from pathlib import Path
        launcher = Path(sys.prefix) / 'bin/odm-dense-research'
        subprocess.run([str(launcher), '--help'], check=True)
        refused = subprocess.run([str(launcher), '--fast-orthophoto', '--help'], capture_output=True, text=True)
        assert refused.returncode != 0 and 'outside' in refused.stderr
    requirements:
      run:
        - python >=3.12,<3.13
about:
  homepage: https://github.com/OpenDroneMap/ODM
  summary: Private CPU dense research candidate; not a complete ODM distribution
  license: LicenseRef-Unreviewed
