# Local research only: source-built candidate, not approved for distribution.
schema_version: 1
package:
  name: odm-research-pygltflib
  version: "1.16.5"
source:
  url: https://files.pythonhosted.org/packages/22/e8/f8232abdf9c085333689b0a428dcd1d0f83edd1ecafa6ed878a633d8c9d5/pygltflib-1.16.5.tar.gz
  sha256: 1f15740d5a7aaf71a5083e285af6b361184958e255659132f4ba8fe4f3d21ea9
build:
  number: 1
  string: research_${{ hash }}_1
  skip: target_platform != "linux-64"
  script:
    interpreter: python
    content: |
      import os, subprocess, sys
      subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--no-index', '--no-build-isolation', '--prefix', os.environ['PREFIX'], os.environ['SRC_DIR']], check=True)
requirements:
  build:
    - python >=3.12,<3.13
    - pip
    - setuptools >=64
    - wheel
  host:
    - python >=3.12,<3.13
  run:
    - python >=3.12,<3.13
    - dataclasses-json
    - deprecated
tests:
  - script:
      interpreter: python
      content: |
        import pygltflib
    requirements:
      run:
        - python >=3.12,<3.13
about:
  homepage: https://gitlab.com/dodgyville/pygltflib
  summary: Private research source build, not approved for distribution
  license: LicenseRef-Unreviewed
