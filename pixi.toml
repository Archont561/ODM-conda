[workspace]
name = "odm-conda"
version = "0.1.0"
description = "Unofficial, modular ODM component packaging with rattler-build"
authors = ["archont561"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Repository tools only. Component build dependencies belong in component recipes.
# The odm-dev environment below is a local development shell for ODM system libraries.
# Mirror pixi-sandbox's explicit direct pins; transitive builds are in pixi.lock.
rattler-build = "==0.68.0"
python = "==3.12.16"
pyyaml = "==6.0.3"
zstandard = "==0.25.0"
pytest = "==9.1.1"
hypothesis = "==6.155.1"
patchelf = "==0.19.2"
actionlint = "==1.7.12"
shellcheck = "==0.11.0"
lefthook = "==2.1.14"
convco = "==0.7.2"
taplo = "==0.10.0"

[tasks]
# Fast parsers/format checks are also used by the staged pre-commit hook.
python-lint = "python scripts/lint_python.py"
toml-format = "taplo fmt"
toml-check = "taplo fmt --check pixi.toml"
lint = "python scripts/lint.py"
agents = "python scripts/check_agents.py"
unit = "python -m pytest tests -v"
# Explicit files also work from a source-only ZIP without a Git root.
workflows = "actionlint -shellcheck shellcheck .github/workflows/ci.yml .github/workflows/build.yml .github/workflows/release.yml .github/workflows/publish-sandbox.yml .github/workflows/relock.yml"
restore-shell = "shellcheck restore.sh"
static = { depends-on = [
  "python-lint",
  "toml-check",
  "lint",
  "agents",
  "workflows",
  "restore-shell",
] }
agent-check = { depends-on = [
  { task = "skills-check", environment = "agent-tools" },
  { task = "agent-unit", environment = "agent-tools" },
] }
render = "python scripts/build.py --render-only"
check = { depends-on = ["static", "unit", "agent-check", "render"] }
commit-lint = "test -f .config/convco.yml && convco check --config .config/convco.yml --from-stdin"
commits = "test -f .config/convco.yml && convco check --config .config/convco.yml"
hooks-install = "lefthook install"
build = "python scripts/build.py"
test = "python scripts/test_package.py"
audit = "python scripts/audit_package.py"
sources = "python scripts/source_bundle.py"
stage-release = "python scripts/stage_release.py"
release-check = "python scripts/release_guard.py"

# Bun's ICU 75 pin cannot share a prefix with this Python build's SQLite/ICU 78.
# JS agent tools need no Python/CMake, so isolate them instead of downgrading Python.
[feature.agent-tools.dependencies]
bun = "==1.3.11"

[feature.agent-tools.tasks]
bun-install = "bun install --frozen-lockfile --silent"
bunx = { depends-on = ["bun-install"], cmd = "bun x --bun" }
skills-check = { depends-on = [
  "bun-install",
], cmd = "bun scripts/check_skills.mjs" }
agent-unit = { depends-on = [
  "bun-install",
], cmd = "bun test tests/agent_skills.test.mjs" }

# Local ODM development shell. Only OpenCV 4.12 and OpenSSL 3 are pinned to ODM/Ubuntu 24.04
# versions. Ceres, PROJ, Boost and Eigen track conda-forge latest: pdal 2.10 needs new
# Ceres, PROJ and Eigen 5, and Boost 1.83 needs ICU 73, which conflicts with the Python 3.12
# pin's ICU 78. CGAL is left out: conda-forge 6.x needs Python 3.13+ and 5.6
# needs Boost 1.82.
# ODM references it only in packaging files. Not packed into recipes; solved separately.
[feature.odm-dev.dependencies]
ceres-solver = "*"
cmake = "*"
eigen = "*"
exiftool = "*"
flann = "*"
libgdal = "*"
gflags = "*"
geos = "*"
geotiff = "*"
glog = "*"
hdf5 = "*"
libjpeg-turbo = "*"
libjxl = "*"
libpng = "*"
libtiff = "*"
libusb = "*"
ninja = "*"
openmpi = "*"
openssl = ">=3,<4"
libopencv = "==4.12.0"
pdal = "*"
pkg-config = "*"
proj = "*"
suitesparse = "*"
tbb = "*"

[environments]
default = []
agent-tools = { features = ["agent-tools"], no-default-feature = true }
odm-dev = { features = ["odm-dev"], solve-group = "odm-dev" }
